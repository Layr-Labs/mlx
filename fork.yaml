        fork commits even though every file below is byte-identical to upstream `v0.32.2`
        (CUDA backend, CPU SIMD, kernels, Python bindings and tests, repository CI and
        templates, `AGENTS.md` / `CLAUDE.md`, docs). Listed here so the page does not credit
        Layr-Labs with upstream's changes; the section disappears once the fork rebases onto
        an upstream commit at or past v0.32.2.
