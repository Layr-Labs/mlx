name: 'Fork build caches'
description: 'Set up a fork-tests build job with ccache and the Metal kernel cache, and save the caches'

# phase: restore runs the setup action, restores the ccache files and the
# Metal kernel cache, and points the build at the cache script in
# .github/scripts/fork-tests/metal-cache. phase: save prints the cache
# statistics and saves each cache on pull requests and on pushes to main
# when the build had cache misses.
#
# Cache keys:
#   ccache  ccache-fork-tests-KIND-FLAGS-clangCLANG-macOS-ARM64-metal-SHA-RUN-ATTEMPT
#   Metal   metal-METAL-KERNELS-KIND-RUN-ATTEMPT
# CLANG is the clang major.minor version. METAL is the metal compiler
# version. FLAGS is a hash of CFLAGS, CXXFLAGS, the deployment target and
# KIND. KIND sets the CMake arguments of the build. KERNELS is a hash of
# mlx/backend/metal/kernels. A restore takes the newest cache with the same
# prefix. The ccache restore falls back to a cache of another clang version;
# ccache checks the compiler content (compiler_check=content), so the
# objects of another compiler only miss. The Metal restore falls back only to
# a cache of the same metal compiler version, and the cache script puts the
# metal compiler version and the SDK build in each entry key.

inputs:
  phase:
    description: 'restore or save'
    required: true
  kind:
    description: 'The build kind: wheel or cpp'
    required: true
  ccache-save-key:
    description: 'phase save: the ccache-save-key output of phase restore'
    required: false
    default: ''
  metal-save-key:
    description: 'phase save: the metal-save-key output of phase restore'
    required: false
    default: ''

outputs:
  cmake-args:
    description: 'The args for generating CMake project'
    value: ${{ steps.setup.outputs.cmake-args }}
  ccache-save-key:
    description: 'The key to save the ccache files with'
    value: ${{ steps.setup.outputs.ccache-save-key }}
  metal-save-key:
    description: 'The key to save the Metal kernel cache with'
    value: ${{ steps.keys.outputs.metal-save }}

runs:
  using: 'composite'
  steps:
    - name: Make the cache keys
      id: keys
      if: inputs.phase == 'restore'
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
        KERNELS: ${{ hashFiles('mlx/backend/metal/kernels/**') }}
      run: |
        # The other lines of --version name the install folder and the OS.
        # They change between runner images, so the keys use the first line.
        version() {
          echo "$1" | head -n 1 | sed -E 's/.* version ([0-9.]+).*/\1/' | tr -c 'A-Za-z0-9.\n' '_'
        }
        clang_text=$(xcrun clang --version)
        metal_text=$(xcrun -sdk macosx metal --version)
        sdk=$(xcrun -sdk macosx --show-sdk-build-version)
        printf '%s\n' "$clang_text" "$metal_text" "SDK build: $sdk"
        clang=$(version "$clang_text" | cut -d . -f 1-2)
        metal=$(version "$metal_text")
        if [ -z "$clang" ] || [ -z "$metal" ] || [ -z "$sdk" ]; then
          echo "::error::Cannot read the clang, metal or SDK version."
          exit 1
        fi
        flags=$(printf '%s\n' "$CFLAGS" "$CXXFLAGS" "$MACOSX_DEPLOYMENT_TARGET" "$KIND" \
          | shasum -a 256 | cut -c 1-16)
        kernels=${KERNELS:0:16}
        {
          echo "toolchain=$(echo "$metal_text" | head -n 1) SDK $sdk"
          echo "ccache-key=fork-tests-$KIND-$flags-clang$clang"
          echo "ccache-fallback=ccache-fork-tests-$KIND-$flags-"
          echo "metal-restore=metal-$metal-$kernels-"
          echo "metal-fallback=metal-$metal-"
          echo "metal-save=metal-$metal-$kernels-$KIND-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        } | tee -a "$GITHUB_OUTPUT"

    - uses: ./.github/actions/setup
      id: setup
      if: inputs.phase == 'restore'
      with:
        toolkit: metal
        ccache-key: ${{ steps.keys.outputs.ccache-key }}
        ccache-fallback: ${{ steps.keys.outputs.ccache-fallback }}
        # The build and the C++ tests do not use openmpi. Only the
        # distributed test in python-gpu shard 0 does.
        install-macos-deps: 'false'

    - name: Restore the Metal kernel cache
      if: inputs.phase == 'restore'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ github.workspace }}/.metal-cache
        key: ${{ steps.keys.outputs.metal-restore }}
        restore-keys: |
          ${{ steps.keys.outputs.metal-restore }}
          ${{ steps.keys.outputs.metal-fallback }}

    - name: Prepare the caches
      if: inputs.phase == 'restore'
      shell: bash
      env:
        TOOLCHAIN: ${{ steps.keys.outputs.toolchain }}
      run: |
        # The script reads the restored entries from MLX_METAL_CACHE_IN and
        # writes each entry that the build uses to MLX_METAL_CACHE_OUT. The
        # saved cache then holds no entries that the build does not use.
        in="$RUNNER_TEMP/metal-cache-in"
        if [ -d .metal-cache ]; then
          mv .metal-cache "$in"
        else
          mkdir -p "$in"
        fi
        echo "Restored Metal cache entries: $(ls "$in" | wc -l)"
        {
          echo "MLX_METAL_CACHE_TOOLCHAIN=$TOOLCHAIN"
          echo "MLX_METAL_CACHE_IN=$in"
          echo "MLX_METAL_CACHE_OUT=$GITHUB_WORKSPACE/.metal-cache"
        } >> "$GITHUB_ENV"
        ccache -z

    - name: Show the cache statistics
      id: stats
      if: inputs.phase == 'save'
      shell: bash
      run: |
        ccache -s -v
        ccache_misses=$(ccache -s | awk '$1 == "Misses:" { print $2; exit }')
        ccache_misses=${ccache_misses:-unknown}
        metal_misses=0
        log="$MLX_METAL_CACHE_OUT.log"
        if [ -f "$log" ]; then
          metal_misses=$(grep -c '^miss ' "$log" || true)
          echo "Metal cache: $(grep -c '^hit ' "$log" || true) hits, $metal_misses misses"
          grep '^miss ' "$log" || true
        fi
        du -sh .ccache .metal-cache || true
        # A build with no misses adds nothing, so it does not save a copy.
        echo "ccache-misses=$ccache_misses" | tee -a "$GITHUB_OUTPUT"
        echo "metal-misses=$metal_misses" | tee -a "$GITHUB_OUTPUT"

    - name: Save the ccache files
      if: inputs.phase == 'save' && steps.stats.outputs.ccache-misses != '0' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{ inputs.ccache-save-key }}

    - name: Save the Metal kernel cache
      if: inputs.phase == 'save' && steps.stats.outputs.metal-misses != '0' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ github.workspace }}/.metal-cache
        key: ${{ inputs.metal-save-key }}
