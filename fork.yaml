title: "Layr-Labs/mlx - MLX fork diff overview"
footer: |
  Fork-diff overview of [`Layr-Labs/mlx`](https://github.com/Layr-Labs/mlx), a fork of
  [`ml-explore/mlx`](https://github.com/ml-explore/mlx) &middot; created with
  [Forkdiff](https://github.com/protolambda/forkdiff)
base:
  name: ml-explore/mlx
  url: https://github.com/ml-explore/mlx
  # The upstream commit this fork is based on: upstream main on 2026-10-22, the
  # head that the fork merged on that date. CI (`scripts/check_forkdiff.py`)
  # requires this hash to equal `git merge-base HEAD upstream/main`. Each upstream
  # merge moves the merge-base, so the gate fails until this hash and the
  # sections below are brought up to date.
  hash: c6abf0dbb4fc141fad739b32ae486c06728e49e5
fork:
  name: Layr-Labs/mlx
  url: https://github.com/Layr-Labs/mlx
  ref: refs/heads/main
def:
  title: "Layr-Labs/mlx"
  description: |
    This is an overview of the changes in [`Layr-Labs/mlx`](https://github.com/Layr-Labs/mlx),
    a fork of [`ml-explore/mlx`](https://github.com/ml-explore/mlx).

    The fork is the core of Layr-Labs' Apple-silicon inference stack — `mlx` → `mlx-c` →
    `mlx-swift` → `mlx-swift-lm` — and carries the kernel, allocator and Metal-runtime work
    that serving production MoE models (Gemma 4, Qwen 3.5/3.6, GPT-OSS) needed before or
    beyond what upstream ships: sorted expert-tile quantized matmul routes, a masked-tail
    MXFP4 decode kernel, FP32-safe SDPA partials, coherent allocator accounting for admission
    control, declared-mutable custom-kernel inputs for paged KV, and a use-after-free fix in
    Metal eval. Every change is meant to be additive and rebasable; each is gated by shape,
    device or environment checks so the upstream path stays the default elsewhere.
  sub:
    - title: "Metal eval: use-after-free with mid-eval synchronization"
      description: |
        `gpu::eval` captured the `MTL::CommandBuffer*` before `eval_gpu` ran and attached the
        input-buffer liveness handler to it afterwards. Any primitive that calls
        `CommandEncoder::synchronize()` mid-eval — the expert-tile route's sortedness-retract
        check does — commits and replaces the encoder's buffer, so the handler landed on a
        dangling pointer (latent on Gemma E=128, a deterministic SIGSEGV on Qwen E=256). The
        buffer is now fetched from the encoder *after* `eval_gpu`, so inputs outlive exactly the
        tail of the primitive's work. (PR #5)
      globs:
        - "mlx/backend/metal/eval.cpp"
    - title: "Sorted expert-tile quantized matmul (Gemma 4 E=128, Qwen 3.5/3.6 E=256)"
      description: |
        An opt-in route (`MLX_GATHER_QMM_EXPERT_SLICES=1|trust`) for gathered, affine-quantized
        MoE expert matmuls: a descriptor kernel builds sorted expert tiles on device (one
        instantiation per expert count) and a single expert-count-agnostic tile kernel consumes
        them. `classify_gemma4_expert_qmm` is a pure route table admitting exactly the shapes
        the kernel is built for; availability is all-or-nothing on a source-matched metallib so
        an older library fails the route closed; `trust` skips the descriptor-retract readback
        when the caller guarantees sorted indices. A retracted call runs the unsorted gather
        route, because the sorted `gather_qmm_rhs` kernels read per-expert offsets and give a
        correct result only for sorted indices (PR #27). Diagnostics counters
        (`mlx_metal_gemma4_expert_qmm_diagnostics_*`) are exposed through a C ABI so mlx-c /
        mlx-swift can arm, snapshot and reset them.
      globs:
        - "mlx/backend/common/gemma4_expert_qmm.h"
        - "mlx/backend/metal/device.h"
        - "mlx/backend/metal/device.cpp"
        - "mlx/backend/metal/kernels/quantized.h"
        - "mlx/backend/metal/kernels/quantized.metal"
        - "mlx/backend/metal/quantized.cpp"
        - "tests/gpu_tests.cpp"
    - title: "Thread-scoped command-buffer commit limits"
      description: |
        `mlx_metal_set_thread_command_buffer_limits(max_ops, max_mb, ...)` overrides, for the
        calling thread only, when its command buffers commit: after `max_ops` operations or
        `max_mb` megabytes of distinct inputs instead of the device defaults (zero keeps a
        default; the previous values are returned for restoring). Evaluation encodes on the
        thread that calls `eval`/`async_eval`, so a caller can give single-token decode steps
        larger buffers (the CPU encodes further ahead of the GPU) while prefill keeps the
        defaults and their memory bound. The Ultra defaults (50 ops / 50 MB) count weight
        inputs, so multi-GB expert banks commit after almost every MoE operation.
        Partitioning work into command buffers does not change results.
      globs:
        - "mlx/backend/common/command_buffer_limits.h"
        - "mlx/backend/metal/device.h"
        - "mlx/backend/metal/device.cpp"
    - title: "GPT-OSS MXFP4 decode: masked-tail gathered qmv"
      description: |
        GPT-OSS 20B gathered MXFP4 decode has K=2880, which misses the fast vector kernel's
        512-element alignment and fell to the general path. `fp_gather_qmv_fast_tail` runs five
        full blocks plus a 320-value tail read only by the participating lanes, preserving FP32
        accumulation and the gathered indices/strides. It is enabled automatically only on the
        physical M4 Max architecture (`applegpu_g16s`) for the exact MXFP4/group-32/4-bit,
        E=32, K=2880, N=2880|5760, FP32/BF16 shape; `MLX_GPTOSS_MXFP4_DECODE_FAST_TAIL=0`
        restores the original route and `MLX_GPTOSS_MXFP4_PREFILL_TILE=m32n32k32` opts into a
        separately measured prefill tile (`gptoss_mxfp4_policy.h`). (PR #14)
        `fp_quantized.metal` also builds the two m32n32k32 prefill-tile kernels (float and
        bfloat16) ahead of time, so CMake builds with the default `MLX_METAL_JIT=OFF` can load
        them. (PR #24)
      globs:
        - "mlx/backend/metal/gptoss_mxfp4_policy.h"
        - "mlx/backend/metal/kernels/fp_quantized.h"
        - "mlx/backend/metal/kernels/fp_quantized.metal"
        - "mlx/backend/metal/quantized.cpp"
        - "tests/gptoss_mxfp4_tests.cpp"
        - "tests/CMakeLists.txt"
    - title: "Coherent allocator accounting for admission control"
      description: |
        Admission accounting used to combine independent reads of the allocator counters with
        logical buffer sizes, so concurrent allocator activity could produce an incoherent
        snapshot and alignment / cache reuse could make the real backing larger than the
        request. `get_memory_snapshot()` reads active / cache / peak under one lock;
        `get_allocation_size_upper_bound()` and the detached, lock-free
        `AllocationFootprintPolicy` bound a buffer including alignment and the (now inclusive,
        overflow-checked) cache-reuse limit shared with `BufferCache`. Metal, CPU and CUDA
        allocators implement the same interface; the allocator's own behaviour stays the
        authority. These describe allocator accounting, not process RSS. (PR #15)
        The public process-allocation cap API adds install-once Metal backing enforcement.
        Reservations include pending allocations and the fixed heap. Owned page-aligned VM
        regions use Metal no-copy buffers; credit returns after the deallocator unmaps them.
        Foreign wrappers retain caller ownership. CPU/CUDA reject this optional API; soft
        memory limits are unchanged. Residency insertion rolls back failed registration before
        callers release buffers, including ordinary uncapped allocations. Standalone CPU and
        real-Metal tests cover delayed release, churn, and injected construction failures.
        Capped no-copy pages are first touched on the CPU so process physical
        footprint accounts for pages later written by the GPU.
        The native footprint contract is documented in `docs/src/usage/unified_memory.rst`.
      globs:
        - "mlx/memory.h"
        - "mlx/backend/common/allocation_footprint.h"
        - "mlx/backend/common/process_allocation_cap.h"
        - "tests/standalone/process_allocation_cap*.cpp"
        - "mlx/backend/common/buffer_cache.h"
        - "mlx/backend/metal/allocator.h"
        - "mlx/backend/metal/allocator.cpp"
        - "mlx/backend/metal/resident.cpp"
        - "mlx/backend/cuda/allocator.h"
        - "mlx/backend/cuda/allocator.cpp"
        - "mlx/backend/no_gpu/allocator.cpp"
        - "tests/allocator_tests.cpp"
        - "docs/src/usage/unified_memory.rst"
    - title: "FP32 partial sums in two-pass vector SDPA"
      description: |
        The two-pass vector SDPA cast unnormalized partial sums to the input dtype before
        combining them: BF16 lost cancellation residuals and FP16 could overflow even when the
        final output was representable. Partials now stay FP32 through the second pass and only
        the final result is cast; kernel entry names change so a stale shader cannot silently
        satisfy the new buffer contract. Python regressions cover cancellation and overflow
        across D64/D128/D256, 32/128 partitions, masked and unmasked. (PR #16)
      globs:
        - "mlx/backend/metal/kernels/sdpa_vector.h"
        - "mlx/backend/metal/kernels/scaled_dot_product_attention.metal"
        - "mlx/backend/metal/scaled_dot_product_attention.cpp"
        - "python/tests/test_fast_sdpa.py"
    - title: "Declared-mutable inputs for Metal custom kernels"
      description: |
        `metal_kernel_with_mutable_inputs` lets a caller declare which custom-kernel inputs will
        be written, so paged-KV consumers keep writes on the original allocation and Metal sees
        the read/write hazard. Mutable names must identify exactly one input; mutable `device`
        pointers are generated (including for small/scalar storage) and take part in the
        compiled-kernel identity; an implicit contiguous copy of declared-mutable storage is
        rejected; allocations are registered for writes as well as reads. A separate
        `MutableInputCustomKernel` primitive serializes the declaration while the existing
        `CustomKernel` export schema is untouched. (PR #18)
      globs:
        - "mlx/fast.h"
        - "mlx/fast_primitives.h"
        - "mlx/backend/common/metal_kernel.cpp"
        - "mlx/backend/metal/custom_kernel.cpp"
        - "mlx/export.cpp"
    - title: "Cross-thread compile-cache cleanup"
      description: |
        Compile caches became thread-local upstream; bindings built before that (the mlx-c /
        mlx-swift consumers) still call the process-wide `compile_erase` / `compile_clear_cache`.
        A process-lifetime registry records each thread's cache once at construction so those
        entrypoints can erase or clear every live cache, with no per-call hot-path work. (PR #10)
      globs:
        - "mlx/compile.cpp"
        - "mlx/compile_impl.h"
        - "tests/compile_tests.cpp"
    - title: "Integer floor_divide tests"
      description: |
        The fork keeps its regression tests for integer `floor_divide` from PR #32. Upstream
        now does the fix itself: ml-explore/mlx #4515 fixes `floor_divide` in `ops.cpp` and
        #4642 adds a `FloorDivide` primitive that rounds down. The fork dropped its own flooring `Divide` functors when it merged
        upstream on 2026-10-22, so integer `Divide` truncates again, as in upstream. The tests
        check negative operands of every signed integer type, the SIMD and scalar paths,
        unsigned and floating-point division, and compiled graphs. On the CPU they also check
        that `x // 0` gives 0 and `min // -1` gives the minimum value. Upstream's CPU
        `floor_divide` divided `min` by -1, which overflows and traps on x86 (SIGFPE). The
        fork divides by 1 there, as PR #32 did, so the result wraps to `min`.
      globs:
        - "mlx/backend/cpu/simd/base_simd.h"
        - "mlx/backend/cpu/simd/accelerate_simd.h"
        - "tests/ops_tests.cpp"
        - "python/tests/test_ops.py"
    - title: "Validated custom Metal threadgroups and bounded compiler retry"
      description: |
        Custom kernels refuse invalid axes, counts beyond UINT32_MAX and axes beyond
        the device limits before allocating outputs. A nonempty grid with complete
        x-axis multiples of the group width and groups (512,1,1) or (1024,1,1) may retry an insufficient
        pipeline with max_total_threads_per_threadgroup(requestedWidth) on its unique generated
        declaration. The original capable pipeline is retained; retry compilation
        and the selected pipeline's actual capacity remain authoritative. Other
        geometries refuse without clamping. Shader math and dispatch axes do not change.
      globs:
        - "python/tests/test_metal_threadgroup_bounds.py"
        - "docs/src/dev/custom_metal_kernels.rst"
    - title: "Quantized tile bounds and distinct loader symbols"
      description: |
        Sorted gathered matrix products use the remaining reduction width for a
        partial activation tile. Safe affine and floating-quantized weight loaders
        check row and packed-column bounds on both legacy and NAX paths before
        reading weights or scales, then
        zero invalid lanes. This prevents finite tails from reading the next row,
        including a following NaN row. Exact Python regressions cover affine,
        MXFP4, MXFP8 and directly packed NVFP4 with FP16 and BF16 inputs.
        Each affine/floating-point, legacy/NAX loader has a distinct type name.
        Their layouts or bodies differ; sharing a name corrupts MXFP4 results
        when the offline Metal linker combines the translation units. The
        incompatible affine/FP pack-factor helpers and legacy/NAX vector loaders
        also use distinct names.
        Aligned dispatch and accumulation precision remain unchanged.
      globs:
        - "mlx/backend/metal/kernels/quantized.h"
        - "mlx/backend/metal/kernels/quantized_nax.h"
        - "mlx/backend/metal/kernels/fp_quantized.h"
        - "mlx/backend/metal/kernels/fp_quantized_nax.h"
        - "python/tests/test_quantized.py"
    - title: "CPU quantized accumulation precision"
      description: |
        Scalar affine, MXFP4, MXFP8 and NVFP4 matrix products accumulate in FP32
        and convert once when writing each output. Both matrix orientations and
        the FP group sum preserve partial sums instead of rounding every addition
        to BF16 or FP16. Exact CPU regressions compare constant products with
        dequantized matmul, including sorted and unsorted gathered affine paths.
        Quantization, packing, indexing and Metal kernels remain unchanged.
      globs:
        - "mlx/backend/cpu/quantized.cpp"
        - "python/tests/test_quantized.py"
    - title: "Every simdgroup runs the MMA in the sorted gather_qmm NAX kernels"
      description: |
        The fork reverts one upstream change in two NAX kernels: the simdgroup skip of
        [ml-explore/mlx#4352](https://github.com/ml-explore/mlx/pull/4352) (`c7ff35d9`, kept by
        [ml-explore/mlx#4572](https://github.com/ml-explore/mlx/pull/4572) as
        `sg_active = sgp_sm > 0`). `fp_gather_qmm_rhs_nax` and `affine_gather_qmm_rhs_nax` run
        the MMA in every simdgroup. With the skip, mixture-of-experts serving on a two-Mac
        JACCL pair with one NAX GPU lost all-reduce completions and left 92 to 96 GiB wired
        until a reboot. Stores stay bounded by `sgp_sm`, so the output does not change. Keep
        the revert at every upstream merge. Upstream added the row-tile scheduling of #4567
        and #4572, which the fork had carried as a backport in PR #27, so only this revert
        remains.
      globs:
        - "mlx/backend/metal/kernels/quantized_nax.h"
        - "mlx/backend/metal/kernels/fp_quantized_nax.h"
    - title: "64-bit products in the JACCL ring and the vector SDPA layout check"
      description: |
        The JACCL ring computes each wire's byte offset as `lr * n_wires * size`. Upstream
        multiplies `lr` and `n_wires` as `int` before the product widens to 64 bits, and
        compares `size_ * 2 * n_conns_` as `int`. The fork widens the first operand to
        `int64_t`, so each product is computed in 64 bits. The values are small, so the result
        does not change. The vector SDPA path checks a query layout with
        `strides[2] == shape[3] * shape[bidx]`, where the product is `int` and the stride is
        64-bit. The fork widens `shape[3]` to `int64_t` there too. These changes close the CodeQL
        alerts `cpp/integer-multiplication-cast-to-long` in these files.
      globs:
        - "mlx/distributed/jaccl/lib/jaccl/ring_impl.h"
        - "mlx/distributed/jaccl/lib/jaccl/ring.cpp"
        - "mlx/backend/metal/scaled_dot_product_attention.cpp"
    - title: "CPU qqmm refuses a global scale"
      description: |
        The CPU `QQMatmul` kernel has no global scale input. Upstream passes the scales to it,
        and the kernel ignores them, so `qqmm` with `global_scale_x` and `global_scale_w` on
        a CPU stream returns a wrong result with no error (upstream marks this as a TODO in
        `test_quantized.py`). The fork's CPU test pass found it: the error was about 1000
        against a tolerance of 1e-3. `qqmm` now raises "Global scale is only supported on the
        GPU" on a stream that is not a GPU stream, as `gather_qmm` already does.
      globs:
        - "mlx/ops.cpp"
    - title: "Fork tooling"
      description: |
        The fork deletes the upstream workflows that cannot run here: the PyPI release build,
        the documentation deploy and the daily bypass-list update with its two scripts.
        `build_and_test.yml` keeps the lint, sanitizer and Fedora jobs. The fork deletes the
        jobs that run only in the upstream repository, and the composite actions that only
        the deleted workflows and jobs used. An upstream merge adds these files again, so
        delete them again at each merge.

        The gate that keeps this page honest: `check_forkdiff.py` fails CI when `base.hash` is
        not the merge-base with upstream, when a file the fork changes is not described by a
        section above, or when a section names files the fork no longer changes.

        `fork-tests.yml` builds the fork with Metal and runs its C++ and Python tests on a
        GitHub-hosted macOS runner. The `setup` action pins its actions to full commit SHAs,
        because the organization blocks actions that are not pinned. The organization also
        blocks `hendrikmuhs/ccache-action`, so `setup` installs ccache with Homebrew and keeps
        the ccache files with `actions/cache`. It then runs the same tests a second time with
        the CPU as the default device. Three Python tests check behavior that exists only in
        the Metal backend (Winograd batch tiling, the Winograd switch and the FFT size limit),
        so they skip when the default device is not the GPU. Upstream's
        `test_init_reduce_large_output` makes a 4 GiB output. The GitHub-hosted runner has a
        3.5 GiB Metal buffer limit and 7 GB of memory, so the test skips on a device that
        cannot hold the output. When a CPU test file fails, the job prints the end of its log
        at once. Upstream tests that run only a GPU path (forced fused SDPA, global-scale
        `qqmm` and `gather_qmm`) check on the CPU pass that the documented error is raised.
      globs:
        - ".github/actions/build/action.yml"
        - ".github/actions/build-docs/action.yml"
        - ".github/actions/build-wheel/action.yml"
        - ".github/actions/test-linux/action.yml"
        - ".github/actions/test-wheel/action.yml"
        - ".github/actions/test-windows/action.yml"
        - ".github/workflows/build_and_test.yml"
        - ".github/workflows/documentation.yml"
        - ".github/workflows/release.yml"
        - ".github/workflows/update_bypass_list.yml"
        - ".github/scripts/find-eligible-contributors.js"
        - ".github/scripts/update-bypass-list.js"
        - "scripts/check_forkdiff.py"
        - "FORKDIFF.md"
        - "README.md"
        - ".github/actions/setup/action.yml"
        - ".github/workflows/fork-tests.yml"
        - "python/tests/test_conv.py"
        - "python/tests/test_fft.py"
        - "python/tests/test_reduce.py"

# ignored globally, does not count towards line count
ignore:
  - "fork.yaml"
  - ".github/workflows/forkdiff-check.yml"
  - ".github/workflows/forkdiff-pages.yml"
