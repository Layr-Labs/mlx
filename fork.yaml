title: "Layr-Labs/mlx - MLX fork diff overview"
footer: |
  Fork-diff overview of [`Layr-Labs/mlx`](https://github.com/Layr-Labs/mlx), a fork of
  [`ml-explore/mlx`](https://github.com/ml-explore/mlx) &middot; created with
  [Forkdiff](https://github.com/protolambda/forkdiff)
base:
  name: ml-explore/mlx
  url: https://github.com/ml-explore/mlx
  # The upstream commit this fork is based on. CI (`scripts/check_forkdiff.py`)
  # requires this to equal `git merge-base HEAD upstream/main`, so a rebase onto
  # newer upstream fails the gate until the hash — and the sections below — are
  # brought up to date. Upstream main as of 2026-08-14.
  hash: 77a0c1e8ae16eb781a79e2b7134ba84b2ee7b597
fork:
  name: Layr-Labs/mlx
  url: https://github.com/Layr-Labs/mlx
  ref: refs/heads/main
def:
  title: "Layr-Labs/mlx"
  description: |
    This is an overview of the changes in [`Layr-Labs/mlx`](https://github.com/Layr-Labs/mlx),
    a fork of [`ml-explore/mlx`](https://github.com/ml-explore/mlx).

    The fork is the core of Layr-Labs' Apple-silicon inference stack — `mlx` → `mlx-c` →
    `mlx-swift` → `mlx-swift-lm` — and carries the kernel, allocator and Metal-runtime work
    that serving production MoE models (Gemma 4, Qwen 3.5/3.6, GPT-OSS) needed before or
    beyond what upstream ships: sorted expert-tile quantized matmul routes, a masked-tail
    MXFP4 decode kernel, FP32-safe SDPA partials, coherent allocator accounting for admission
    control, declared-mutable custom-kernel inputs for paged KV, and a use-after-free fix in
    Metal eval. Every change is meant to be additive and rebasable; each is gated by shape,
    device or environment checks so the upstream path stays the default elsewhere.

    The fork also changes JACCL, the RDMA-over-Thunderbolt backend that runs one model across
    two Macs: it zeroes the unused tail of every send frame, and a progress guard fails a call
    that gets no completion, closes its group and by default releases the GPU memory and exits
    the process with status 75. These two are not gated. The zeroing is always on, and the
    guard is on with a 30 s limit that `JACCL_PROGRESS_TIMEOUT_MS=0` removes;
    `JACCL_TIMEOUT_ACTION=throw` keeps the process alive and throws instead.

    Three sections are not fork work at all: the fork carries upstream's own v0.32.2 changes
    (applied in PR #10 rather than merged) and two sets of cherry-picked upstream fixes, and
    those files are listed as such so the page stays honest about what Layr-Labs actually
    changed.
  sub:
    - title: "Metal eval: use-after-free with mid-eval synchronization"
      description: |
        `gpu::eval` captured the `MTL::CommandBuffer*` before `eval_gpu` ran and attached the
        input-buffer liveness handler to it afterwards. Any primitive that calls
        `CommandEncoder::synchronize()` mid-eval — the expert-tile route's sortedness-retract
        check does — commits and replaces the encoder's buffer, so the handler landed on a
        dangling pointer (latent on Gemma E=128, a deterministic SIGSEGV on Qwen E=256). The
        buffer is now fetched from the encoder *after* `eval_gpu`, so inputs outlive exactly the
        tail of the primitive's work. (PR #5)
      globs:
        - "mlx/backend/metal/eval.cpp"
    - title: "Sorted expert-tile quantized matmul (Gemma 4 E=128, Qwen 3.5/3.6 E=256)"
      description: |
        An opt-in route (`MLX_GATHER_QMM_EXPERT_SLICES=1|trust`) for gathered, affine-quantized
        MoE expert matmuls: a descriptor kernel builds sorted expert tiles on device (one
        instantiation per expert count) and a single expert-count-agnostic tile kernel consumes
        them. `classify_gemma4_expert_qmm` is a pure route table admitting exactly the shapes
        the kernel is built for; availability is all-or-nothing on a source-matched metallib so
        an older library fails the route closed; `trust` skips the descriptor-retract readback
        when the caller guarantees sorted indices. A retracted call runs the unsorted gather
        route, because the sorted `gather_qmm_rhs` kernels read per-expert offsets and give a
        correct result only for sorted indices. Diagnostics counters
        (`mlx_metal_gemma4_expert_qmm_diagnostics_*`) are exposed through a C ABI so mlx-c /
        mlx-swift can arm, snapshot and reset them. Also in these kernels: every affine
        quantized-vector bias-sum operand is promoted to the accumulator type before summation
        (PR #15).
      globs:
        - "mlx/backend/common/gemma4_expert_qmm.h"
        - "mlx/backend/metal/device.h"
        - "mlx/backend/metal/device.cpp"
        - "mlx/backend/metal/kernels/quantized.h"
        - "mlx/backend/metal/kernels/quantized.metal"
        - "tests/gpu_tests.cpp"
    - title: "Thread-scoped command-buffer commit limits"
      description: |
        `mlx_metal_set_thread_command_buffer_limits(max_ops, max_mb, ...)` overrides, for the
        calling thread only, when its command buffers commit: after `max_ops` operations or
        `max_mb` megabytes of distinct inputs instead of the device defaults (zero keeps a
        default; the previous values are returned for restoring). Evaluation encodes on the
        thread that calls `eval`/`async_eval`, so a caller can give single-token decode steps
        larger buffers (the CPU encodes further ahead of the GPU) while prefill keeps the
        defaults and their memory bound. The Ultra defaults (50 ops / 50 MB) count weight
        inputs, so multi-GB expert banks commit after almost every MoE operation.
        Partitioning work into command buffers does not change results.
      globs:
        - "mlx/backend/common/command_buffer_limits.h"
        - "mlx/backend/metal/device.h"
        - "mlx/backend/metal/device.cpp"
    - title: "GPT-OSS MXFP4 decode: masked-tail gathered qmv"
      description: |
        GPT-OSS 20B gathered MXFP4 decode has K=2880, which misses the fast vector kernel's
        512-element alignment and fell to the general path. `fp_gather_qmv_fast_tail` runs five
        full blocks plus a 320-value tail read only by the participating lanes, preserving FP32
        accumulation and the gathered indices/strides. It is enabled automatically only on the
        physical M4 Max architecture (`applegpu_g16s`) for the exact MXFP4/group-32/4-bit,
        E=32, K=2880, N=2880|5760, FP32/BF16 shape; `MLX_GPTOSS_MXFP4_DECODE_FAST_TAIL=0`
        restores the original route and `MLX_GPTOSS_MXFP4_PREFILL_TILE=m32n32k32` opts into a
        separately measured prefill tile (`gptoss_mxfp4_policy.h`). (PR #14)
        `fp_quantized.metal` also builds the two m32n32k32 prefill-tile kernels (float and
        bfloat16) ahead of time, so CMake builds with the default `MLX_METAL_JIT=OFF` can load
        them. (PR #24)
      globs:
        - "mlx/backend/metal/gptoss_mxfp4_policy.h"
        - "mlx/backend/metal/kernels/fp_quantized.h"
        - "mlx/backend/metal/kernels/fp_quantized.metal"
        - "mlx/backend/metal/quantized.cpp"
        - "tests/gptoss_mxfp4_tests.cpp"
        - "tests/CMakeLists.txt"
    - title: "Coherent allocator accounting for admission control"
      description: |
        Admission accounting used to combine independent reads of the allocator counters with
        logical buffer sizes, so concurrent allocator activity could produce an incoherent
        snapshot and alignment / cache reuse could make the real backing larger than the
        request. `get_memory_snapshot()` reads active / cache / peak under one lock;
        `get_allocation_size_upper_bound()` and the detached, lock-free
        `AllocationFootprintPolicy` bound a buffer including alignment and the (now inclusive,
        overflow-checked) cache-reuse limit shared with `BufferCache`. Metal, CPU and CUDA
        allocators implement the same interface; the allocator's own behaviour stays the
        authority. These describe allocator accounting, not process RSS. (PR #15)
        The public process-allocation cap API adds install-once Metal backing enforcement.
        Reservations include pending allocations and the fixed heap. Owned page-aligned VM
        regions use Metal no-copy buffers; credit returns after the deallocator unmaps them.
        Foreign wrappers retain caller ownership. CPU/CUDA reject this optional API; soft
        memory limits are unchanged. Residency insertion rolls back failed registration before
        callers release buffers, including ordinary uncapped allocations. Standalone CPU and
        real-Metal tests cover delayed release, churn, and injected construction failures.
        Capped no-copy pages are first touched on the CPU so process physical
        footprint accounts for pages later written by the GPU.
        The native footprint contract is documented in `docs/src/usage/unified_memory.rst`.
      globs:
        - "mlx/memory.h"
        - "mlx/backend/common/allocation_footprint.h"
        - "mlx/backend/common/process_allocation_cap.h"
        - "tests/standalone/process_allocation_cap*.cpp"
        - "mlx/backend/common/buffer_cache.h"
        - "mlx/backend/metal/allocator.h"
        - "mlx/backend/metal/allocator.cpp"
        - "mlx/backend/metal/resident.cpp"
        - "mlx/backend/cuda/allocator.h"
        - "mlx/backend/cuda/allocator.cpp"
        - "mlx/backend/no_gpu/allocator.cpp"
        - "tests/allocator_tests.cpp"
        - "docs/src/usage/unified_memory.rst"
    - title: "FP32 partial sums in two-pass vector SDPA"
      description: |
        The two-pass vector SDPA cast unnormalized partial sums to the input dtype before
        combining them: BF16 lost cancellation residuals and FP16 could overflow even when the
        final output was representable. Partials now stay FP32 through the second pass and only
        the final result is cast; kernel entry names change so a stale shader cannot silently
        satisfy the new buffer contract. Python regressions cover cancellation and overflow
        across D64/D128/D256, 32/128 partitions, masked and unmasked. (PR #16)
      globs:
        - "mlx/backend/metal/kernels/sdpa_vector.h"
        - "mlx/backend/metal/kernels/scaled_dot_product_attention.metal"
        - "mlx/backend/metal/scaled_dot_product_attention.cpp"
        - "python/tests/test_fast_sdpa.py"
    - title: "Declared-mutable inputs for Metal custom kernels"
      description: |
        `metal_kernel_with_mutable_inputs` lets a caller declare which custom-kernel inputs will
        be written, so paged-KV consumers keep writes on the original allocation and Metal sees
        the read/write hazard. Mutable names must identify exactly one input; mutable `device`
        pointers are generated (including for small/scalar storage) and take part in the
        compiled-kernel identity; an implicit contiguous copy of declared-mutable storage is
        rejected; allocations are registered for writes as well as reads. A separate
        `MutableInputCustomKernel` primitive serializes the declaration while the existing
        `CustomKernel` export schema is untouched. (PR #18)
      globs:
        - "mlx/fast.h"
        - "mlx/fast_primitives.h"
        - "mlx/backend/common/metal_kernel.cpp"
        - "mlx/backend/metal/custom_kernel.cpp"
        - "mlx/export.cpp"
    - title: "Cross-thread compile-cache cleanup"
      description: |
        Compile caches became thread-local upstream; bindings built before that (the mlx-c /
        mlx-swift consumers) still call the process-wide `compile_erase` / `compile_clear_cache`.
        A process-lifetime registry records each thread's cache once at construction so those
        entrypoints can erase or clear every live cache, with no per-call hot-path work. (PR #10)
      globs:
        - "mlx/compile.cpp"
        - "mlx/compile_impl.h"
        - "tests/compile_tests.cpp"
    - title: "Integer floor_divide rounds down"
      description: |
        `floor_divide` on integers uses the `Divide` primitive. The CPU and Metal `Divide`
        functors truncated toward zero, so `-7 // 2` gave -3. NumPy and Python give -4. For
        signed integers the functors now subtract 1 when the remainder is not zero and the
        signs are different. On the CPU the signed-integer functor does not divide by 0 or
        divide the minimum value by -1, because C++ does not define these. It returns 0 for
        `x // 0` and the minimum value for `min // -1`, the same values as before. The Metal
        Shading Language does not define these cases either. Unsigned and floating-point
        division do not change. Upstream fixed the same defect in `ops.cpp` (ml-explore/mlx
        #4515); the fork does the fix in the kernels. If a later upstream sync ports #4515 on
        top of these kernels, `floor_divide` subtracts 1 twice; the tests catch this. The CUDA
        `Divide` functor (`cuda/device/binary_ops.cuh:36-41`) does not change and still
        truncates; no workflow in this fork builds CUDA. mlx-swift keeps generated copies of
        both headers (`Source/Cmlx/mlx-generated/binary_ops.cpp`,
        `mlx-generated/metal/binary_ops.h`, `mlx-generated/compiled_preamble.cpp`), so
        `tools/update-mlx.sh` must run at the mlx-swift pin bump.
      globs:
        - "mlx/backend/cpu/binary_ops.h"
        - "mlx/backend/metal/kernels/binary_ops.h"
        - "tests/ops_tests.cpp"
        - "python/tests/test_ops.py"
    - title: "Validated custom Metal threadgroups and bounded compiler retry"
      description: |
        Custom kernels refuse invalid axes, counts beyond UINT32_MAX and axes beyond
        the device limits before allocating outputs. A nonempty grid with complete
        x-axis multiples of the group width and groups (512,1,1) or (1024,1,1) may retry an insufficient
        pipeline with max_total_threads_per_threadgroup(requestedWidth) on its unique generated
        declaration. The original capable pipeline is retained; retry compilation
        and the selected pipeline's actual capacity remain authoritative. Other
        geometries refuse without clamping. Shader math and dispatch axes do not change.
      globs:
        - "python/tests/test_metal_threadgroup_bounds.py"
        - "docs/src/dev/custom_metal_kernels.rst"
    - title: "JACCL: zeroed send-frame tails, a progress guard and the advertised GID"
      description: |
        JACCL is the RDMA-over-Thunderbolt backend. Upstream has changed none of the three
        things below.

        Send frames: JACCL posts every frame at the full size of its scratch buffer, so a
        payload shorter than the buffer went to the peer followed by the bytes of earlier
        sends. `stage_send_frame` (`send_frame.h`) copies the payload and zeroes the rest of
        the frame, and every mesh and ring send path stages through
        `SharedBuffer::stage_send`. The posted sizes and the receive paths are unchanged.

        Progress guard: the polling loops waited for completions without a limit and never
        read `wc.status`, so a rank whose peer had died spun on a full core until it was
        killed, and a failed completion was used as data. `ProgressGuard`
        (`progress_guard.h`) is called after every poll of every mesh and ring loop. A
        completion with a failure status, or a failed `ibv_poll_cq`, is an error at once; no
        completion for longer than `JACCL_PROGRESS_TIMEOUT_MS` /
        `MLX_JACCL_PROGRESS_TIMEOUT_MS` (default 30000 ms; `0` or a negative value removes
        the limit) is an error. The clock is read once per 1024 polls that return nothing, so
        the polling fast path gains a counter and no clock read. The failed call first
        destroys the group's queue pairs and completion queues and deregisters its buffers;
        the ring does so only after all wires have returned. Then, by default
        (`JACCL_TIMEOUT_ACTION` / `MLX_JACCL_TIMEOUT_ACTION` = `teardown-exit`), it prints the
        reason, runs the memory release hook that MLX's `jaccl.cpp` registers
        (`set_wired_limit(0)`, then `clear_cache()`, at most 10 s) and leaves through
        `std::_Exit(75)`, a restartable status. With `throw` it throws a `[jaccl]`
        `std::runtime_error` instead; every later call on that group throws immediately and
        the group cannot be reopened in the process. `dispatch_wires` also reports the errors
        of the ring pool wires, which it used to drop. Each completion queue has four times
        the entries its queue pair can have outstanding (`COMPLETION_QUEUE_DEPTH`, used by
        `mesh.cpp` and `ring.cpp` when they create the queues). MLX's `jaccl.cpp` registers
        the release hook each time it wraps a new JACCL group.

        Startup readiness: a per-group one-shot budget of 1..900000 ms replaces the
        idle limit until its fixed monotonic deadline. Progress never renews it. Begin/end
        refuse running calls; callers drain queued work and serialize scheduling. End
        restores the original idle policy and refuses expired or closed groups. The MLX
        Group API forwards to JACCL only; unsupported backends refuse without fallback.

        Advertised GID: `Connection::info()` advertises the IPv4-mapped GID of the port, but
        `queue_pair_rtr` sent from GID index 1 whatever the index of that GID. The connection
        now remembers the index where the advertised GID was found and sends from it;
        behaviour is unchanged where that index is 1.

        `tests/jaccl` is a separate CMake project that the MLX build does not build. It
        compiles the real mesh, ring and RDMA headers against simulated verbs and checks the
        frame tails, the guard and the release path under ASan, UBSan and TSan. `ring_impl.h`
        also carries the upstream ring `all_gather` fix described further down.
      globs:
        - "mlx/distributed/jaccl/jaccl.cpp"
        - "mlx/distributed/jaccl/lib/README.md"
        - "mlx/distributed/jaccl/lib/jaccl/mesh.cpp"
        - "mlx/distributed/jaccl/lib/jaccl/mesh_impl.h"
        - "mlx/distributed/jaccl/lib/jaccl/progress_guard.h"
        - "mlx/distributed/jaccl/lib/jaccl/startup_wait_budget.h"
        - "mlx/distributed/jaccl/lib/jaccl/group.h"
        - "mlx/distributed/jaccl/lib/jaccl/mesh.h"
        - "mlx/distributed/jaccl/lib/jaccl/ring.h"
        - "mlx/distributed/distributed.h"
        - "mlx/distributed/distributed_impl.h"
        - "mlx/distributed/jaccl/lib/jaccl/rdma.cpp"
        - "mlx/distributed/jaccl/lib/jaccl/rdma.h"
        - "mlx/distributed/jaccl/lib/jaccl/ring.cpp"
        - "mlx/distributed/jaccl/lib/jaccl/ring_impl.h"
        - "mlx/distributed/jaccl/lib/jaccl/send_frame.h"
        - "docs/src/usage/distributed.rst"
        - "docs/src/usage/environment_variables.rst"
        - "tests/jaccl/*"
        - "tests/jaccl/fake_verbs/infiniband/verbs.h"
    - title: "Two-rank sealed all-sum"
      description: |
        The embedding program installs an authenticated frame codec for a two-rank
        floating-point all-sum. The CPU communication stream seals each partial,
        gathers the frames, opens the peer frame and adds in rank order. Missing
        codecs and authentication failures refuse evaluation without a plaintext
        fallback. The distributed primitive retains its temporary arrays until
        the queued work completes. On a two-rank JACCL mesh the sum streams in 256 KiB
        pieces, each with its own AES-256-GCM tag, over `MeshImpl::exchange`: a piece is
        sent as soon as it is sealed and opened and added as soon as it lands. Other
        groups keep the seal-gather-open path. Non-Apple builds use synchronous
        piece sealing and opening without Apple dispatch or QoS APIs, preserving
        the authenticated wire format and rank-ordered arithmetic. Apple keeps
        its existing parallel path.
      globs:
        - "mlx/distributed/CMakeLists.txt"
        - "mlx/distributed/primitives.h"
        - "mlx/distributed/sealed.cpp"
        - "mlx/distributed/sealed.h"
        - "mlx/distributed/sealed_stream.h"
        - "tests/distributed_sealed_stream_tests.cpp"
    - title: "Fast fence waits order earlier kernels in the same Metal pass"
      description: |
        An ordinary fast-synchronization GPU fence wait follows both pending
        command passes and earlier kernels in the current concurrent encoder.
        The in-pass buffer barrier matches the existing fenced-input consumer
        path. Without it, a spinning wait can run before a GPU producer needed
        by the CPU work it awaits. Arithmetic and command-buffer limits do not
        change. A standalone bounded test checks exact GPU-to-CPU-to-GPU chains,
        shared side roots and request-array retirement at several buffer sizes.
        Fork Tests executes the three CTest processes on its Metal runner and
        rejects a missing test registration. This component coverage does not
        establish an installed RDMA model fix.
      globs:
        - "mlx/backend/metal/fence.cpp"
        - "tests/metal_fence_chain.cpp"
        - "tests/CMakeLists.txt"
        - "docs/src/usage/using_streams.rst"
        - ".github/workflows/fork-tests.yml"
    - title: "GPU streams wait for each other on events"
      description: |
        With fast synch (`MLX_METAL_FAST_SYNCH=1`) a fence wait on the GPU is a one-thread
        kernel that spins until the producer's timestamp arrives. That is safe when the
        producer is a CPU stream (a thread always progresses), but not when it is another
        GPU stream: Metal does not promise that a second command queue runs while a pass of
        the first one spins, so the producing queue can starve and both stop. An eval whose
        graph spans two GPU streams therefore waits for the other GPU stream on a shared
        event (the non-fast path), while CPU <-> GPU waits keep the fast path. An array read
        both by the CPU and by another GPU stream updates both fences. Synchronization only:
        results do not change.
      globs:
        - "mlx/fence.h"
        - "mlx/transforms.cpp"
        - "mlx/backend/metal/fence.cpp"
        - "mlx/backend/no_gpu/fence.cpp"
        - "mlx/backend/cuda/fence.cpp"
        - "docs/src/usage/using_streams.rst"
    - title: "Helper ops keep the caller's stream"
      description: |
        `quantized_matmul` cast `x`, `scales` and `biases`, `gather` and `scatter` broadcast
        their indices, the gather matmuls cast their indices, and `affine_quantize` selected
        its scales on the thread's default stream instead of the stream the caller passed.
        mlx-swift passes its own process-wide stream to every op, so each of these helpers
        put a second GPU stream into the graph: a 4-bit projection with float32 input and
        bfloat16 scales crossed streams twice, and every crossing is a fence wait. They now
        use the caller's stream. Where an op runs does not change what it computes.
      globs:
        - "mlx/ops.cpp"
        - "tests/ops_tests.cpp"
    - title: "Fused cross-device fence update"
      description: |
        Opt-in (`MLX_METAL_FUSED_FENCE_UPDATE=1`, fast synch only). A GPU array that the CPU
        reads in the same eval is made coherent and its fence timestamp is written in one
        dispatch (`fence_update_coherent`) instead of `input_coherent` then `fence_update`.
        Every word is still rewritten with system-coherent stores before a system-scope fence.
        The last threadgroup to finish writes the timestamp. The fence buffer carries an
        arrival count that only increases, so an unfinished earlier dispatch can delay a
        timestamp but cannot release it early. Synchronization only: results do not change.
      globs:
        - "mlx/backend/metal/fence.cpp"
        - "mlx/backend/metal/kernels/fence.metal"
        - "mlx/utils.h"
        - "docs/src/usage/environment_variables.rst"
    - title: "Fenced custom-kernel inputs"
      description: |
        Opt-in (`MLX_METAL_FENCED_INPUTS=1`, fast synch only). `metal_kernel_with_fenced_inputs`
        declares inputs that can come from a CPU stream in the same eval, such as a CPU-stream
        all-sum. The source calls `MLX_FENCED_INPUT_WAIT(name)` before it reads such an input.
        MLX then gives the CPU fence and its count to the kernel instead of a `fence_wait`
        dispatch, and thread 0 of each threadgroup spins on it. The kernel starts after every
        pass and kernel encoded before it (`wait_for_all_pending` and a barrier), as the
        `fence_wait` pass does, so the CPU work it waits for never waits for it. MLX keeps the
        separate wait when the input is copied first, when another GPU stream feeds the CPU
        in the same eval, and while exporting. The declaration is not part of the exported
        schema. Synchronization only: results do not change.
      globs:
        - "mlx/fence.h"
        - "mlx/transforms.cpp"
        - "mlx/fast.h"
        - "mlx/fast_primitives.h"
        - "mlx/backend/common/metal_kernel.cpp"
        - "mlx/backend/metal/custom_kernel.cpp"
        - "mlx/backend/metal/fence.cpp"
        - "mlx/backend/metal/fenced_input.h"
        - "mlx/backend/no_gpu/fence.cpp"
        - "mlx/backend/cuda/fence.cpp"
        - "mlx/utils.h"
        - "docs/src/usage/environment_variables.rst"
    - title: "Cheaper custom-kernel launches and graph bookkeeping"
      description: |
        Host time only: generated sources, kernel names, buffers and dispatch order do not
        change. Custom-kernel primitives share the cached generated source and resolve the
        pipeline once per source; repeat launches skip rebuilding the name, template string
        and cache key, and bind inputs directly when none needs a contiguous copy. Graph
        teardown dedups node inputs with a small vector, `eval_impl`'s per-node map is a flat
        open-addressing map, and allocation reads the device's maximum buffer length once.
      globs:
        - "mlx/array.cpp"
        - "mlx/transforms.cpp"
        - "mlx/fast_primitives.h"
        - "mlx/backend/common/metal_kernel.cpp"
        - "mlx/backend/metal/custom_kernel.cpp"
        - "mlx/backend/metal/allocator.cpp"
        - "mlx/backend/cuda/custom_kernel.cpp"
    - title: "Quantized tile bounds and distinct loader symbols"
      description: |
        Sorted gathered matrix products use the remaining reduction width for a
        partial activation tile. Safe affine and floating-quantized weight loaders
        check row and packed-column bounds on both legacy and NAX paths before
        reading weights or scales, then
        zero invalid lanes. This prevents finite tails from reading the next row,
        including a following NaN row. Exact Python regressions cover affine,
        MXFP4, MXFP8 and directly packed NVFP4 with FP16 and BF16 inputs.
        Each affine/floating-point, legacy/NAX loader has a distinct type name.
        Their layouts or bodies differ; sharing a name corrupts MXFP4 results
        when the offline Metal linker combines the translation units. The
        incompatible affine/FP pack-factor helpers and legacy/NAX vector loaders
        also use distinct names.
        Aligned dispatch and accumulation precision remain unchanged.
      globs:
        - "mlx/backend/metal/kernels/quantized.h"
        - "mlx/backend/metal/kernels/quantized_nax.h"
        - "mlx/backend/metal/kernels/fp_quantized.h"
        - "mlx/backend/metal/kernels/fp_quantized_nax.h"
        - "python/tests/test_quantized.py"
    - title: "CPU quantized accumulation precision"
      description: |
        Scalar affine, MXFP4, MXFP8 and NVFP4 matrix products accumulate in FP32
        and convert once when writing each output. Both matrix orientations and
        the FP group sum preserve partial sums instead of rounding every addition
        to BF16 or FP16. Exact CPU regressions compare constant products with
        dequantized matmul, including sorted and unsorted gathered affine paths.
        Quantization, packing, indexing and Metal kernels remain unchanged.
      globs:
        - "mlx/backend/cpu/quantized.cpp"
        - "python/tests/test_quantized.py"
    - title: "Upstream v0.32.2 sync carried in PR #10"
