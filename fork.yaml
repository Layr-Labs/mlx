title: "Layr-Labs/mlx - MLX fork diff overview"
footer: |
  Fork-diff overview of [`Layr-Labs/mlx`](https://github.com/Layr-Labs/mlx), a fork of
  [`ml-explore/mlx`](https://github.com/ml-explore/mlx) &middot; created with
  [Forkdiff](https://github.com/protolambda/forkdiff)
base:
  name: ml-explore/mlx
  url: https://github.com/ml-explore/mlx
  # The upstream commit this fork is based on: upstream main on 2026-10-23, the
  # head that the fork merged on that date. CI (`scripts/check_forkdiff.py`)
  # requires this hash to equal `git merge-base HEAD upstream/main`. Each upstream
  # merge moves the merge-base, so the gate fails until this hash and the
  # sections below are brought up to date.
  hash: afc03c51105a8e25e70fa2ba0befb214e4f5ec6f
fork:
  name: Layr-Labs/mlx
  url: https://github.com/Layr-Labs/mlx
  ref: refs/heads/main
def:
  title: "Layr-Labs/mlx"
  description: |
    This is an overview of the changes in [`Layr-Labs/mlx`](https://github.com/Layr-Labs/mlx),
    a fork of [`ml-explore/mlx`](https://github.com/ml-explore/mlx).

    The fork is the core of Layr-Labs' Apple-silicon inference stack — `mlx` → `mlx-c` →
    `mlx-swift` → `mlx-swift-lm` — and carries the kernel, allocator and Metal-runtime work
    that serving production MoE models (Gemma 4, Qwen 3.5/3.6, GPT-OSS) needed before or
    beyond what upstream ships: sorted expert-tile quantized matmul routes, a masked-tail
    MXFP4 decode kernel, FP32-safe SDPA partials, coherent allocator accounting for admission
    control, declared-mutable custom-kernel inputs for paged KV, and a use-after-free fix in
    Metal eval. Every change is meant to be additive and rebasable; each is gated by shape,
    device or environment checks so the upstream path stays the default elsewhere.

    The fork also changes JACCL, the RDMA-over-Thunderbolt backend that runs one model across
    two Macs: it zeroes the unused tail of every send frame, and a progress guard fails a call
    that gets no completion, closes its group and by default releases the GPU memory and exits
    the process with status 75. These two are not gated. The zeroing is always on, and the
    guard is on with a 30 s limit that `JACCL_PROGRESS_TIMEOUT_MS=0` removes;
    `JACCL_TIMEOUT_ACTION=throw` keeps the process alive and throws instead.
  sub:
    - title: "Metal eval: use-after-free with mid-eval synchronization"
      description: |
        `gpu::eval` captured the `MTL::CommandBuffer*` before `eval_gpu` ran and attached the
        input-buffer liveness handler to it afterwards. Any primitive that calls
        `CommandEncoder::synchronize()` mid-eval — the expert-tile route's sortedness-retract
        check does — commits and replaces the encoder's buffer, so the handler landed on a
        dangling pointer (latent on Gemma E=128, a deterministic SIGSEGV on Qwen E=256). The
        buffer is now fetched from the encoder *after* `eval_gpu`, so inputs outlive exactly the
        tail of the primitive's work. (PR #5)
      globs:
        - "mlx/backend/metal/eval.cpp"
    - title: "Sorted expert-tile quantized matmul (Gemma 4 E=128, Qwen 3.5/3.6 E=256)"
      description: |
        An opt-in route (`MLX_GATHER_QMM_EXPERT_SLICES=1|trust`) for gathered, affine-quantized
        MoE expert matmuls: a descriptor kernel builds sorted expert tiles on device (one
        instantiation per expert count) and a single expert-count-agnostic tile kernel consumes
        them. `classify_gemma4_expert_qmm` is a pure route table admitting exactly the shapes
        the kernel is built for; availability is all-or-nothing on a source-matched metallib so
        an older library fails the route closed; `trust` skips the descriptor-retract readback
        when the caller guarantees sorted indices. A retracted call runs the unsorted gather
        route, because the sorted `gather_qmm_rhs` kernels read per-expert offsets and give a
        correct result only for sorted indices (PR #27). Diagnostics counters
        (`mlx_metal_gemma4_expert_qmm_diagnostics_*`) are exposed through a C ABI so mlx-c /
        mlx-swift can arm, snapshot and reset them.
      globs:
        - "mlx/backend/common/gemma4_expert_qmm.h"
        - "mlx/backend/metal/device.h"
        - "mlx/backend/metal/device.cpp"
        - "mlx/backend/metal/kernels/quantized.h"
        - "mlx/backend/metal/kernels/quantized.metal"
        - "mlx/backend/metal/quantized.cpp"
        - "tests/gpu_tests.cpp"
    - title: "Thread-scoped command-buffer commit limits"
      description: |
        `mlx_metal_set_thread_command_buffer_limits(max_ops, max_mb, ...)` overrides, for the
        calling thread only, when its command buffers commit: after `max_ops` operations or
        `max_mb` megabytes of distinct inputs instead of the device defaults (zero keeps a
        default; the previous values are returned for restoring). Evaluation encodes on the
        thread that calls `eval`/`async_eval`, so a caller can give single-token decode steps
        larger buffers (the CPU encodes further ahead of the GPU) while prefill keeps the
        defaults and their memory bound. The Ultra defaults (50 ops / 50 MB) count weight
        inputs, so multi-GB expert banks commit after almost every MoE operation.
        Partitioning work into command buffers does not change results.
      globs:
        - "mlx/backend/common/command_buffer_limits.h"
        - "mlx/backend/metal/device.h"
        - "mlx/backend/metal/device.cpp"
    - title: "GPT-OSS MXFP4 decode: masked-tail gathered qmv"
      description: |
        GPT-OSS 20B gathered MXFP4 decode has K=2880, which misses the fast vector kernel's
        512-element alignment and fell to the general path. `fp_gather_qmv_fast_tail` runs five
        full blocks plus a 320-value tail read only by the participating lanes, preserving FP32
        accumulation and the gathered indices/strides. It is enabled automatically only on the
        physical M4 Max architecture (`applegpu_g16s`) for the exact MXFP4/group-32/4-bit,
        E=32, K=2880, N=2880|5760, FP32/BF16 shape; `MLX_GPTOSS_MXFP4_DECODE_FAST_TAIL=0`
        restores the original route and `MLX_GPTOSS_MXFP4_PREFILL_TILE=m32n32k32` opts into a
        separately measured prefill tile (`gptoss_mxfp4_policy.h`). (PR #14)
        `fp_quantized.metal` also builds the two m32n32k32 prefill-tile kernels (float and
        bfloat16) ahead of time, so CMake builds with the default `MLX_METAL_JIT=OFF` can load
        them. (PR #24)
      globs:
        - "mlx/backend/metal/gptoss_mxfp4_policy.h"
        - "mlx/backend/metal/kernels/fp_quantized.h"
        - "mlx/backend/metal/kernels/fp_quantized.metal"
        - "mlx/backend/metal/quantized.cpp"
        - "tests/gptoss_mxfp4_tests.cpp"
        - "tests/CMakeLists.txt"
    - title: "Coherent allocator accounting for admission control"
      description: |
        Admission accounting used to combine independent reads of the allocator counters with
        logical buffer sizes, so concurrent allocator activity could produce an incoherent
        snapshot and alignment / cache reuse could make the real backing larger than the
        request. `get_memory_snapshot()` reads active / cache / peak under one lock;
        `get_allocation_size_upper_bound()` and the detached, lock-free
        `AllocationFootprintPolicy` bound a buffer including alignment and the (now inclusive,
        overflow-checked) cache-reuse limit shared with `BufferCache`. Metal, CPU and CUDA
        allocators implement the same interface; the allocator's own behaviour stays the
        authority. These describe allocator accounting, not process RSS. (PR #15)
        The public process-allocation cap API adds install-once Metal backing enforcement.
        Reservations include pending allocations and the fixed heap. Owned page-aligned VM
        regions use Metal no-copy buffers; credit returns after the deallocator unmaps them.
        Foreign wrappers retain caller ownership. CPU/CUDA reject this optional API; soft
        memory limits are unchanged. Residency insertion rolls back failed registration before
        callers release buffers, including ordinary uncapped allocations. Standalone CPU and
        real-Metal tests cover delayed release, churn, and injected construction failures.
        `tests/CMakeLists.txt` builds them as their own executables, because the cap is
        install-once in each process, and gives one ctest entry to each case of the Metal test.
        The Metal test uses `allocator().malloc` / `allocator().free`, which return and free a
        plain `Buffer`, because upstream #4634 made `allocator::malloc` return an owning `Data`.
        The allocator makes no fixed heap on a virtual GPU (the GitHub-hosted runner), so the
        cases check the heap charge and heap use that match the device. The registration cases
        fill one residency set with a page first, so that the injected failure of a new set is
        reached with or without the heap in set 0.
        When the device has no residency sets (`ResidencySets::enabled()` is false: no Metal 3
        GPU family or macOS before 15, as on the virtual GPU of the hosted runner), the path
        these cases test does not exist. They then print the reason and exit with 77, which
        ctest reports as skipped (`SKIP_RETURN_CODE`). David ruled on 2026-10-24 to skip by
        capability, like the 4 GiB capability skip below.
        Capped no-copy pages are first touched on the CPU so process physical
        footprint accounts for pages later written by the GPU.
        The native footprint contract is documented in `docs/src/usage/unified_memory.rst`.
      globs:
        - "mlx/memory.h"
        - "mlx/backend/common/allocation_footprint.h"
        - "mlx/backend/common/process_allocation_cap.h"
        - "tests/standalone/process_allocation_cap*.cpp"
        - "tests/CMakeLists.txt"
        - "mlx/backend/common/buffer_cache.h"
        - "mlx/backend/metal/allocator.h"
        - "mlx/backend/metal/allocator.cpp"
        - "mlx/backend/metal/resident.cpp"
        - "mlx/backend/cuda/allocator.h"
        - "mlx/backend/cuda/allocator.cpp"
        - "mlx/backend/no_gpu/allocator.cpp"
        - "tests/allocator_tests.cpp"
        - "docs/src/usage/unified_memory.rst"
    - title: "FP32 partial sums in two-pass vector SDPA"
      description: |
        The two-pass vector SDPA cast unnormalized partial sums to the input dtype before
        combining them: BF16 lost cancellation residuals and FP16 could overflow even when the
        final output was representable. Partials now stay FP32 through the second pass and only
        the final result is cast; kernel entry names change so a stale shader cannot silently
        satisfy the new buffer contract. Python regressions cover cancellation and overflow
        across D64/D128/D256, 32/128 partitions, masked and unmasked. (PR #16)
      globs:
        - "mlx/backend/metal/kernels/sdpa_vector.h"
        - "mlx/backend/metal/kernels/scaled_dot_product_attention.metal"
        - "mlx/backend/metal/scaled_dot_product_attention.cpp"
        - "python/tests/test_fast_sdpa.py"
    - title: "Declared-mutable inputs for Metal custom kernels"
      description: |
        `metal_kernel_with_mutable_inputs` lets a caller declare which custom-kernel inputs will
        be written, so paged-KV consumers keep writes on the original allocation and Metal sees
        the read/write hazard. Mutable names must identify exactly one input; mutable `device`
        pointers are generated (including for small/scalar storage) and take part in the
        compiled-kernel identity; an implicit contiguous copy of declared-mutable storage is
        rejected; allocations are registered for writes as well as reads. A separate
        `MutableInputCustomKernel` primitive serializes the declaration while the existing
        `CustomKernel` export schema is untouched. (PR #18)
      globs:
        - "mlx/fast.h"
        - "mlx/fast_primitives.h"
        - "mlx/backend/common/metal_kernel.cpp"
        - "mlx/backend/metal/custom_kernel.cpp"
        - "mlx/export.cpp"
    - title: "Cross-thread compile-cache cleanup"
      description: |
        Compile caches became thread-local upstream; bindings built before that (the mlx-c /
        mlx-swift consumers) still call the process-wide `compile_erase` / `compile_clear_cache`.
        A process-lifetime registry records each thread's cache once at construction so those
        entrypoints can erase or clear every live cache, with no per-call hot-path work. (PR #10)
      globs:
        - "mlx/compile.cpp"
        - "mlx/compile_impl.h"
        - "tests/compile_tests.cpp"
    - title: "Freed compiled closures leave every thread cache"
      description: |
        `compile(std::function)` keys a closure by the address of a heap copy of it. Upstream,
        the deleter of that copy erases the key only from the cache of the thread that called
        `compile()`. Each call records its trace in the cache of the calling thread, so a trace
        from another thread stayed after the copy was freed. The trace kept its arrays alive,
        and a later closure at the same address could replay it. The deleter now erases the key
        from every live thread cache through the registry above, before the delete. The test
        `test freeing a compiled closure erases every thread cache` records a trace on a second
        thread, frees the closure, and checks that the captured array is uniquely referenced.
        (PR #43)
      globs:
        - "mlx/compile.cpp"
        - "tests/compile_tests.cpp"
    - title: "Freed Python compiled functions leave every thread cache"
      description: |
        The Python binding keys the traces of `mx.compile(fun)` by the address of `fun`. Upstream,
        `PyCompiledFun` keeps the cache of the thread that called it last, and its destructor
        erases the key only from that cache. Each call records its trace in the cache of the
        calling thread, so a trace from another thread stayed after the free. The trace kept its
        arrays alive, and a later compile of a callable at the same address replayed it without a
        new trace. The destructor now erases the key from every live thread cache through the
        registry above, before it releases `fun`, and `PyCompiledFun` no longer keeps a cache.
        The test `test_compile_free_erases_every_thread_cache` calls a compiled function on two
        threads, frees it on the thread that called it last, and compiles the same callable
        again on the other thread. It expects a new trace there. (PR #44)
      globs:
        - "python/src/transforms.cpp"
        - "python/tests/test_compile.py"
    - title: "Integer floor_divide tests"
      description: |
        The fork keeps its regression tests for integer `floor_divide` from PR #32. Upstream
        now does the fix itself: ml-explore/mlx #4515 fixes `floor_divide` in `ops.cpp` and
        #4642 adds a `FloorDivide` primitive that rounds down. The fork dropped its own flooring `Divide` functors when it merged
        upstream on 2026-10-22, so integer `Divide` truncates again, as in upstream. The tests
        check negative operands of every signed integer type, the SIMD and scalar paths,
        unsigned and floating-point division, and compiled graphs. On the CPU they also check
        that `x // 0` gives 0 and `min // -1` gives the minimum value. Upstream's CPU
        `floor_divide` divided `min` by -1, which overflows and traps on x86 (SIGFPE). The
        fork divides by 1 there, as PR #32 did, so the result wraps to `min`.
      globs:
        - "mlx/backend/cpu/simd/base_simd.h"
        - "mlx/backend/cpu/simd/accelerate_simd.h"
        - "tests/ops_tests.cpp"
        - "python/tests/test_ops.py"
    - title: "Validated custom Metal threadgroups and bounded compiler retry"
      description: |
        Custom kernels refuse invalid axes, counts beyond UINT32_MAX and axes beyond
        the device limits before allocating outputs. A nonempty grid with complete
        x-axis multiples of the group width and groups (512,1,1) or (1024,1,1) may retry an insufficient
        pipeline with max_total_threads_per_threadgroup(requestedWidth) on its unique generated
        declaration. The original capable pipeline is retained; retry compilation
        and the selected pipeline's actual capacity remain authoritative. Other
        geometries refuse without clamping. Shader math and dispatch axes do not change.
      globs:
        - "python/tests/test_metal_threadgroup_bounds.py"
        - "docs/src/dev/custom_metal_kernels.rst"
    - title: "JACCL: zeroed send-frame tails, a progress guard and the advertised GID"
      description: |
        JACCL is the RDMA-over-Thunderbolt backend. Upstream has changed none of the three
        things below.

        Send frames: JACCL posts every frame at the full size of its scratch buffer, so a
        payload shorter than the buffer went to the peer followed by the bytes of earlier
        sends. `stage_send_frame` (`send_frame.h`) copies the payload and zeroes the rest of
        the frame, and every mesh and ring send path stages through
        `SharedBuffer::stage_send`. The posted sizes and the receive paths are unchanged.

        Progress guard: the polling loops waited for completions without a limit and never
        read `wc.status`, so a rank whose peer had died spun on a full core until it was
        killed, and a failed completion was used as data. `ProgressGuard`
        (`progress_guard.h`) is called after every poll of every mesh and ring loop. A
        completion with a failure status, or a failed `ibv_poll_cq`, is an error at once; no
        completion for longer than `JACCL_PROGRESS_TIMEOUT_MS` /
        `MLX_JACCL_PROGRESS_TIMEOUT_MS` (default 30000 ms; `0` or a negative value removes
        the limit) is an error. The clock is read once per 1024 polls that return nothing, so
        the polling fast path gains a counter and no clock read. The failed call first
        destroys the group's queue pairs and completion queues and deregisters its buffers;
        the ring does so only after all wires have returned. Then, by default
        (`JACCL_TIMEOUT_ACTION` / `MLX_JACCL_TIMEOUT_ACTION` = `teardown-exit`), it prints the
        reason, runs the memory release hook that MLX's `jaccl.cpp` registers
        (`set_wired_limit(0)`, then `clear_cache()`, at most 10 s) and leaves through
        `std::_Exit(75)`, a restartable status. With `throw` it throws a `[jaccl]`
        `std::runtime_error` instead; every later call on that group throws immediately and
        the group cannot be reopened in the process. The ring keeps its own guarded
        `dispatch_wires`, which also reports the errors of the ring pool wires that it used
        to drop. A mesh with more than one wire (upstream's second cable) has one `MeshImpl`,
        and so one guard, for each wire, and the wires of a `MeshGroup` share one failure
        flag: a failed wire closes its own queue pairs and buffers, a wire that waits in the
        same call stops with `WireStopped` and closes its own, and every later call on the
        group is refused. The mesh runs its wires through the
        shared `dispatch_wires` in `threadpool.h`, which upstream lets drop the error of a
        pool wire; the fork throws that error after all wires returned. A region that the
        verbs refuse to deregister is reported and kept for the destructor, as a refused
        queue pair or completion queue is. Each completion
        queue has four times the entries its queue pair can have outstanding
        (`COMPLETION_QUEUE_DEPTH`, used by `mesh.cpp` and `ring.cpp` when they create the
        queues). MLX's `jaccl.cpp` registers the release hook each time it wraps a new JACCL
        group.

        Advertised GID: `Connection::info()` advertises the IPv4-mapped GID of the port, but
        `queue_pair_rtr` sent from GID index 1 whatever the index of that GID. The connection
        now remembers the index where the advertised GID was found and sends from it;
        behaviour is unchanged where that index is 1.

        `tests/jaccl` is a separate CMake project that the MLX build does not build; the
        `build-cpp` job of Fork Tests builds it and runs it. It
        compiles the real mesh, ring and RDMA headers against simulated verbs and checks the
        frame tails, the guard and the release path under ASan, UBSan and TSan.
      globs:
        - "mlx/distributed/jaccl/jaccl.cpp"
        - "mlx/distributed/jaccl/lib/README.md"
        - "mlx/distributed/jaccl/lib/jaccl/mesh.cpp"
        - "mlx/distributed/jaccl/lib/jaccl/mesh_impl.h"
        - "mlx/distributed/jaccl/lib/jaccl/progress_guard.h"
        - "mlx/distributed/jaccl/lib/jaccl/rdma.cpp"
        - "mlx/distributed/jaccl/lib/jaccl/rdma.h"
        - "mlx/distributed/jaccl/lib/jaccl/ring.cpp"
        - "mlx/distributed/jaccl/lib/jaccl/ring_impl.h"
        - "mlx/distributed/jaccl/lib/jaccl/send_frame.h"
        - "mlx/distributed/jaccl/lib/jaccl/threadpool.h"
        - "docs/src/usage/distributed.rst"
        - "docs/src/usage/environment_variables.rst"
        - "tests/jaccl/*"
        - "tests/jaccl/fake_verbs/infiniband/verbs.h"
    - title: "Quantized tile bounds and distinct loader symbols"
      description: |
        Sorted gathered matrix products use the remaining reduction width for a
        partial activation tile. Safe affine and floating-quantized weight loaders
        check row and packed-column bounds on both legacy and NAX paths before
        reading weights or scales, then
        zero invalid lanes. This prevents finite tails from reading the next row,
        including a following NaN row. Exact Python regressions cover affine,
        MXFP4, MXFP8 and directly packed NVFP4 with FP16 and BF16 inputs.
        Each affine/floating-point, legacy/NAX loader has a distinct type name.
        Their layouts or bodies differ; sharing a name corrupts MXFP4 results
        when the offline Metal linker combines the translation units. The
        incompatible affine/FP pack-factor helpers and legacy/NAX vector loaders
        also use distinct names.
        Aligned dispatch and accumulation precision remain unchanged.
      globs:
        - "mlx/backend/metal/kernels/quantized.h"
        - "mlx/backend/metal/kernels/quantized_nax.h"
        - "mlx/backend/metal/kernels/fp_quantized.h"
        - "mlx/backend/metal/kernels/fp_quantized_nax.h"
        - "python/tests/test_quantized.py"
    - title: "CPU quantized accumulation precision"
      description: |
        Scalar affine, MXFP4, MXFP8 and NVFP4 matrix products accumulate in FP32
        and convert once when writing each output. Both matrix orientations and
        the FP group sum preserve partial sums instead of rounding every addition
        to BF16 or FP16. Exact CPU regressions compare constant products with
        dequantized matmul, including sorted and unsorted gathered affine paths.
        Quantization, packing, indexing and Metal kernels remain unchanged.
      globs:
        - "mlx/backend/cpu/quantized.cpp"
        - "python/tests/test_quantized.py"
    - title: "Every simdgroup runs the MMA in the sorted gather_qmm NAX kernels"
      description: |
        The fork reverts one upstream change in two NAX kernels: the simdgroup skip of
        [ml-explore/mlx#4352](https://github.com/ml-explore/mlx/pull/4352) (`c7ff35d9`, kept by
        [ml-explore/mlx#4572](https://github.com/ml-explore/mlx/pull/4572) as
        `sg_active = sgp_sm > 0`). `fp_gather_qmm_rhs_nax` and `affine_gather_qmm_rhs_nax` run
        the MMA in every simdgroup. With the skip, mixture-of-experts serving on a two-Mac
        JACCL pair with one NAX GPU lost all-reduce completions and left 92 to 96 GiB wired
        until a reboot. Stores stay bounded by `sgp_sm`, so the output does not change. Keep
        the revert at every upstream merge. Upstream added the row-tile scheduling of #4567
        and #4572, which the fork had carried as a backport in PR #27, so only this revert
        remains.
      globs:
        - "mlx/backend/metal/kernels/quantized_nax.h"
        - "mlx/backend/metal/kernels/fp_quantized_nax.h"
    - title: "JIT instantiation of the NAX head-dim split attention kernel"
      description: |
        `get_steel_attention_nax_kernel` builds the JIT source of both `attention_nax` and
        `attention_nax_dsplit`, and upstream passes `bv` to both. `attention_nax_dsplit` has
        no `BV` template parameter (its value head dim is `BD`), so every later argument
        shifts by one, an integer lands in the `MaskType` slot, and the library does not
        compile. JIT builds such as mlx-swift's compile this kernel at runtime for full
        attention with head dim 256 or 512 and at least 1,024 query tokens on NAX GPUs, and
        the caller's process exited with "Unable to build metal library from source". The
        fork passes the split kernel the same arguments as its instantiation in
        `steel_attention_nax.metal`; the non-split kernel is unchanged. Builds that use the
        precompiled metallib were not affected. This is a latent upstream bug (PR #48).
      globs:
        - "mlx/backend/metal/jit_kernels.cpp"
    - title: "64-bit products in the JACCL ring and the vector SDPA layout check"
      description: |
        The JACCL ring computes each wire's byte offset as `lr * n_wires * size`. Upstream
        multiplies `lr` and `n_wires` as `int` before the product widens to 64 bits, and
        compares `size_ * 2 * n_conns_` as `int`. The fork widens the first operand to
        `int64_t`, so each product is computed in 64 bits. The values are small, so the result
        does not change. The vector SDPA path checks a query layout with
        `strides[2] == shape[3] * shape[bidx]`, where the product is `int` and the stride is
        64-bit. The fork widens `shape[3]` to `int64_t` there too. These changes close the CodeQL
        alerts `cpp/integer-multiplication-cast-to-long` in these files.
      globs:
        - "mlx/distributed/jaccl/lib/jaccl/ring_impl.h"
        - "mlx/distributed/jaccl/lib/jaccl/ring.cpp"
        - "mlx/backend/metal/scaled_dot_product_attention.cpp"
    - title: "CPU qqmm refuses a global scale"
      description: |
        The CPU `QQMatmul` kernel has no global scale input. Upstream passes the scales to it,
        and the kernel ignores them, so `qqmm` with `global_scale_x` and `global_scale_w` on
        a CPU stream returns a wrong result with no error (upstream marks this as a TODO in
        `test_quantized.py`). The fork's CPU test pass found it: the error was about 1000
        against a tolerance of 1e-3. `qqmm` now raises "Global scale is only supported on the
        GPU" on a stream that is not a GPU stream, as `gather_qmm` already does.
      globs:
        - "mlx/ops.cpp"
    - title: "CPU BLAS gemm clears C when beta is 0"
      description: |
        The CPU backend calls BLAS gemm with beta = 0 in five places: the float32, float64
        and complex64 `matmul` wrappers in `gemms/cblas.cpp` (used by `Matmul`, `AddMM`
        and `SegmentedMM`), `BlockMaskedMM` and `GatherMM` in `masked_mm.cpp`, and the two
        explicit-gemm convolutions in `conv.cpp`. BLAS must not read C when beta is 0, but
        Accelerate can (seen with M = 1). An output buffer from the allocator cache can
        hold old data, for example packed fp4 weights that read as NaN, and NaN * 0 is NaN.
        Upstream's `test_fp_gather_qmm_non_multiple_of_32` found it in the fork's CPU test
        pass: its float32 reference `x @ w_sel` reused the 266240-byte buffer of the
        previous subtest's packed weights. One helper, `clear_gemm_output` in `gemm.h`,
        fills the exact C region of each call (rows by columns, with its `ldc`) with zeros
        before the call. MLX's own SIMD gemm already skips C when beta is 0. This is a
        latent upstream bug.
      globs:
        - "mlx/backend/cpu/gemm.h"
        - "mlx/backend/cpu/gemms/cblas.cpp"
        - "mlx/backend/cpu/masked_mm.cpp"
        - "mlx/backend/cpu/conv.cpp"
    - title: "Reference uniqueness without buffer ownership"
      description: |
        Upstream [ml-explore/mlx#4634](https://github.com/ml-explore/mlx/pull/4634) (`5dbe9991`)
        makes `is_donatable()` also require that MLX owns the buffer, so the allocator never
        reuses a wrapped external buffer. The fork's C API (`mlx_array_get_buffer_info`, field
        `unique`) used `is_donatable()` to prove that no other array references a buffer.
        Callers in mlx-swift-lm use that proof for paged KV segments, checkpoint memory
        accounting and the MTP state, also for wrapped host pages. The fork adds
        `array::is_uniquely_referenced()`: the same reference-count test without the ownership
        test. `is_donatable()` and buffer donation do not change.
      globs:
        - "mlx/array.h"
    - title: "async_eval does not throw a stream task error"
      description: |
        Upstream #4338 raises a CPU stream task error from `synchronize`, and its test
        expects `async_eval` not to throw. But `StreamThread::enqueue` throws the stored
        error on the main thread (#3742). `async_eval` enqueues several tasks: when the
        stream thread runs a failing task before `async_eval` enqueues the next one, that
        enqueue throws. This is a race. It failed `test_async_eval_error_in_synchronize`
        in the fork's CPU test pass on some runs. `async_eval` now holds a
        `scheduler::DeferStreamErrors` guard, and `enqueue` does not throw while the guard
        lives on the thread. `synchronize` throws the error later. `eval` does not change.
        A C++ test stores the error first, so it fails without the fix on every run.
      globs:
        - "mlx/scheduler.h"
        - "mlx/scheduler.cpp"
        - "mlx/transforms.cpp"
        - "tests/scheduler_tests.cpp"
    - title: "half and bfloat16 floor divide in float32"
      description: |
        Upstream computes float16 and bfloat16 `floor_divide`, and the `divmod` quotient, as
        `floor(a / b)` in the half type. The quotient is rounded to the half type before the
        floor, so a true quotient that is less than half an ulp below an integer n rounds
        to n, and the result is n instead of n - 1. numpy's float16 divmod computes in
        float32 from `fmod` (`npy_divmodf`) and gives n - 1. Upstream's unseeded
        `test_divmod` fails for this reason in about 4% of runs per device. The fork now
        computes these two operations for float16 and bfloat16 in float32 with the same
        method as `npy_divmodf` (`mod = fmod(a, b)`, `div = (a - mod) / b`, then a floor
        with the sign correction), and rounds the result once to the output type: in the
        Metal `FloorDivide` (which `DivMod` uses), in the CPU scalar and SIMD
        `floor_divide`, and in the CPU `DivMod`. float32, float64 and integer paths do not
        change. `test_floor_divide_half_rounding_window` uses pairs in the rounding window
        and compares with numpy on the CPU and the GPU. The CUDA kernels do not change; no
        workflow in this fork builds CUDA.
      globs:
        - "mlx/backend/metal/kernels/binary_ops.h"
        - "mlx/backend/cpu/simd/base_simd.h"
        - "mlx/backend/cpu/simd/accelerate_simd.h"
        - "mlx/backend/cpu/binary.cpp"
    - title: "Seeded Python tests"
      description: |
        Upstream Python tests draw their random input from unseeded `mx.random` and
        `np.random`, so each run tests other input. Some tests compare with a reference under
        a fixed tolerance that some inputs exceed: `test_double.test_gemm` (float32 8x8
        matmul against float64, `allclose` rtol 1e-5, atol 1e-8) fails when an element of the
        product is near zero, because the float32 rounding of partial sums of order 1 is
        about 1e-7 and the tolerance there is about 1e-8 + 1e-5 * |y|. It failed for 152 of
        2000 seeds on the CPU. `test_ops.test_scans` (bfloat16 cumsum against a tri-matrix
        sum, rtol 0.02) failed for 4 of 100 seeds on the GPU and 2 of 100 on the CPU. The
        CPU float32 and float64 gemm paths both clear C (section "CPU BLAS gemm clears C when
        beta is 0"), so the gemm failures are tolerance, not a stale output. `MLXTestCase.setUp`
        now seeds both generators with 0 before each test, so each test draws the same input
        in every run; seed 0 passes both tests. Tests that seed their own generators still
        do. The seed search ran in PR #46 (first commit).
      globs:
        - "python/tests/mlx_tests.py"
    - title: "Fork tooling"
      description: |
        The fork deletes the upstream workflows that cannot run here: the PyPI release build,
        the documentation deploy and the daily bypass-list update with its two scripts.
        `build_and_test.yml` keeps the lint, sanitizer and Fedora jobs. The fork deletes the
        jobs that run only in the upstream repository, and the composite actions that only
        the deleted workflows and jobs used. An upstream merge adds these files again, so
        delete them again at each merge.

        The gate that keeps this page honest: `check_forkdiff.py` fails CI when `base.hash` is
        not the merge-base with upstream, when a file the fork changes is not described by a
        section above, or when a section names files the fork no longer changes.

        `fork-tests.yml` builds the fork with Metal and runs its C++ and Python tests on
        GitHub-hosted macOS runners. Two jobs build in parallel. One job builds the Python
        wheel. The other job builds the C++ library and tests, and runs the C++ tests with the
        GPU and then with the CPU as the default device, and builds and runs the JACCL tests
        with simulated verbs (`tests/jaccl`). Then it runs the standalone allocation
        cap tests with ctest, one process for each case. The Python tests run in shard jobs:
        one set with the GPU as the default device, and one set with the CPU.
        `.github/scripts/fork-tests/python-shards.json` gives the shards.
        `python_shards.py` fails a job when a test file is in no shard or in two shards, and
        the last job fails when a test ran in two shards. The last job also merges the coverage
        profiles of all jobs into one report. The `setup` action pins its actions to full
        commit SHAs, because the organization blocks actions that are not pinned. The
        organization also blocks `hendrikmuhs/ccache-action`, so `setup` installs ccache with
        Homebrew and restores the ccache files with `actions/cache`. The `fork-build-cache`
        action saves the ccache files. It also keeps a cache of the compiled Metal kernels: the
        build jobs put `metal-cache/xcrun` first in `PATH`, and that script gives the kernel
        compile and link commands a cache. The key of a kernel is its preprocessed source,
        its arguments, the metal compiler version and the SDK build. The ccache key holds
        the clang version, and ccache checks the compiler content of each object. Three Python tests check behavior that exists only in
        the Metal backend (Winograd batch tiling, the Winograd switch and the FFT size limit),
        so they skip when the default device is not the GPU. Upstream's
        `test_init_reduce_large_output` skips only when the default device cannot hold its
        4 GiB output: on the GPU when `max_buffer_length` is less than 4 GiB, on the CPU when
        `memory_size` is less than 16 GiB. The hosted `macos-26` runner caps Metal buffers at
        3.5 GiB. The test cannot be smaller: it is the regression test for ml-explore/mlx
        #4437, which needs 2^32 output elements (more than one 32-bit grid dimension), and
        bool outputs of one byte each give 4 GiB. David ruled on 2026-10-23 to keep this skip
        and not to use a larger runner. When a Python test entry fails, the job prints the end of
        its log at once. Upstream tests that run only a GPU path (forced fused SDPA, global-scale
        `qqmm` and `gather_qmm`) check on the CPU pass that the documented error is raised.
      globs:
        - ".github/actions/build/action.yml"
        - ".github/actions/build-docs/action.yml"
        - ".github/actions/build-wheel/action.yml"
        - ".github/actions/test-linux/action.yml"
        - ".github/actions/test-wheel/action.yml"
        - ".github/actions/test-windows/action.yml"
        - ".github/workflows/build_and_test.yml"
        - ".github/workflows/documentation.yml"
        - ".github/workflows/release.yml"
        - ".github/workflows/update_bypass_list.yml"
        - ".github/scripts/find-eligible-contributors.js"
        - ".github/scripts/update-bypass-list.js"
        - "scripts/check_forkdiff.py"
        - "FORKDIFF.md"
        - "README.md"
        - ".github/actions/setup/action.yml"
        - ".github/actions/fork-build-cache/action.yml"
        - ".github/scripts/fork-tests/metal-cache/xcrun"
        - ".github/scripts/fork-tests/python-shards.json"
        - ".github/scripts/fork-tests/python_shards.py"
        - ".github/workflows/fork-tests.yml"
        - "python/tests/test_conv.py"
        - "python/tests/test_fft.py"
        - "python/tests/test_reduce.py"

# ignored globally, does not count towards line count
ignore:
  - "fork.yaml"
  - ".github/workflows/forkdiff-check.yml"
  - ".github/workflows/forkdiff-pages.yml"
