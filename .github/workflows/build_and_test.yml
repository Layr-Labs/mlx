name: Build and Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      # For testing CI without starting a pull request:
      - test/*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check_lint:
    name: Check Lint
    runs-on: [self-hosted, linux, ARM64, darkbloom-linux-arm64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: |
          python -m venv "$RUNNER_TEMP/lint-venv"
          "$RUNNER_TEMP/lint-venv/bin/python" -m pip install pre-commit
          "$RUNNER_TEMP/lint-venv/bin/python" -m pip freeze --local
          echo "$RUNNER_TEMP/lint-venv/bin" >> "$GITHUB_PATH"
      - name: Choose this job's Actions cache
        run: |
          if [[ ${RUNNER_NAME:-} == darkbloom-* && -z ${DARKBLOOM_CACHE_URL:-} ]]; then
            echo "CI_ACTIONS_CACHE=off" >> "$GITHUB_ENV"
            echo "::notice title=Actions cache::The plane gave this Darkbloom Sandbox no cache, so the cache step is skipped."
          fi
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: env.CI_ACTIONS_CACHE != 'off'
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ runner.os }}|${{ runner.arch }}|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files

  linux_sanitizer_build_and_test:
    name: Linux Sanitizer Tests (${{ matrix.sanitizer }})
    needs: check_lint
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASAN, UBSAN]
        # todo 12/16/2025: enable TSAN later + consider enabling ASAN for GPU backend tests.
        # sanitizer: [ASAN, UBSAN, TSAN]
    runs-on: [self-hosted, linux, ARM64, darkbloom-linux-arm64]
    # ASAN takes about 22 minutes natively; a hung run must not hold a sandbox for GitHub's 6-hour default.
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the native sanitizer image tools
        run: |
          [[ "$RUNNER_NAME" == darkbloom-* ]]
          [[ "$(uname -s)" == Linux && "$(uname -m)" == aarch64 ]]
          cmake --version
          cc --version
          c++ --version
          clang --version
          make --version
          git --version

      - name: Linux Build and Test with ${{ matrix.sanitizer }}
        run: |
          bash .github/scripts/build-sanitizer-tests.sh ${{ matrix.sanitizer }}

  linux_fedora_build_cpp_x86_64:
    name: Linux Fedora (x86_64)
    needs: check_lint
    runs-on: ubuntu-22.04
    container:
      image: fedora:42
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: CPP Build Test - No Release
        run: |
          bash ./.github/scripts/setup+build-cpp-linux-fedora-container.sh

  linux_fedora_build_cpp_aarch64:
    name: Linux Fedora (aarch64)
    needs: check_lint
    # The sandbox has no Docker: fedora_proot.py runs the same Fedora script in the archived
    # Fedora 42 container rootfs under PRoot (built from pinned source). About 2.5 minutes.
    runs-on: [self-hosted, linux, ARM64, darkbloom-linux-arm64]
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: CPP Build Test - No Release
        run: |
          python3 .github/scripts/fedora-proot/fedora_proot.py run --source "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/fedora-proot"
