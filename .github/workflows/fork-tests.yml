# Temporary manual admission probe. Never merge this workflow replacement.
name: Classic native-only Mac admission canary (never merge)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, macOS, ARM64, darkbloom-macos-arm64]
    timeout-minutes: 5
    steps:
      - name: Verify the existing twelve-core Mac profile
        env:
          NATIVE_RUNNER: ${{ runner.name }}
        run: |
          set -euo pipefail
          [[ "$NATIVE_RUNNER" == darkbloom-* ]]
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]]
          [[ "$(/usr/sbin/sysctl -n hw.ncpu)" == 12 ]]
          [[ "$(/usr/sbin/sysctl -n hw.memsize)" == 34359738368 ]]
          xcodebuild -version
          xcrun swift --version
          printf 'Classic Mac admission completed on %s\n' "$NATIVE_RUNNER"
