    - title: "Upstream gather_mm and gather_qmm row-tile scheduling (ml-explore/mlx #4567, #4572)"
      description: |
        **Not fork work.** Cherry-picks of upstream commits `a2a09fd5`
        ([ml-explore/mlx#4567](https://github.com/ml-explore/mlx/pull/4567)) and `90089440`
        ([ml-explore/mlx#4572](https://github.com/ml-explore/mlx/pull/4572)). The sorted
        `gather_mm` and `gather_qmm` kernels schedule row tiles from per-expert offsets, so
        one tile holds rows of one expert and does one matmul pass. A small kernel
        (`gather_mm_offsets`) computes the offsets from the sorted `rhs_indices`.

        The `gather_qmm` change is in `quantized.h`, `quantized_nax.h`, `fp_quantized.h`,
        `fp_quantized_nax.h` and `quantized.cpp`, which are listed in the sections that
        describe the fork work in those files. `utils.h` (`schedule_row_tile`) is listed in
        the v0.32.2 section. Two differences from upstream `90089440` remain in the ported
        kernels, because the fork base does not have the related upstream changes: the
        floating-point kernels have no global-scale input, and the NAX kernels keep the
        fork's bound for the last K tile. The section disappears once the fork rebases onto
        an upstream commit at or past `90089440`.

        One upstream change in these NAX kernels is reverted on purpose: the simdgroup skip
        of [ml-explore/mlx#4352](https://github.com/ml-explore/mlx/pull/4352) (`c7ff35d9`,
        which arrived with the v0.32.2 changes; `#4572` kept it as
        `sg_active = sgp_sm > 0`). `fp_gather_qmm_rhs_nax` and `affine_gather_qmm_rhs_nax` run
        the MMA in every simdgroup again. With the skip, mixture-of-experts serving on a
        two-Mac JACCL pair with one NAX GPU lost all-reduce completions and left 92 to 96 GiB
        wired until a reboot. Stores stay bounded by `sgp_sm`, so the output is unchanged.
        Keep the revert at every rebase onto upstream.
      globs:
        - ".gitignore"
        - "benchmarks/python/swiglu_bench.py"
        - "benchmarks/python/swiglu_qmm_bench.py"
        - "mlx/backend/metal/matmul.cpp"
        - "mlx/backend/metal/matmul.h"
        - "mlx/backend/metal/kernels/CMakeLists.txt"
        - "mlx/backend/metal/kernels/gather_mm_offsets.metal"
        - "mlx/backend/metal/kernels/steel/gemm/kernels/steel_gemm_gather.h"
        - "mlx/backend/metal/kernels/steel/gemm/kernels/steel_gemm_gather_nax.h"
    - title: "Upstream JACCL and distributed fixes (ml-explore/mlx #4443, #4557, #4558)"
      description: |
        **Not fork work.** Cherry-picks of upstream commits `7241f12e`
        ([ml-explore/mlx#4443](https://github.com/ml-explore/mlx/pull/4443)), `42987b66`
        ([ml-explore/mlx#4557](https://github.com/ml-explore/mlx/pull/4557)) and `8803e524`
        ([ml-explore/mlx#4558](https://github.com/ml-explore/mlx/pull/4558)), applied without
        changes. #4443: the JACCL ring `all_gather` gave both directions the same slice of each
        rank's region, so the upper half of every peer's region was never transferred. The fix
        is in `ring_impl.h`, which is listed in the JACCL section above, and comes with the
        test `test_all_gather_rank_data`. #4557: `ReduceScatter::eval_cpu` asserted that it
        had no inputs and then read `inputs[0]`, so a build with assertions stopped at every
        `sum_scatter` (`mlx/backend/cpu/distributed.cpp`, listed in the v0.32.2 section).
        #4558: a backend initialization that failed with `strict` off registered an empty
        group, and a later `init` of that backend returned it, even with `strict` on. Its test
        `test_strict_init_after_fallback` needs the `scoped_env` test helper, so that helper
        alone is taken from `ec5f6ff7`
        ([ml-explore/mlx#4474](https://github.com/ml-explore/mlx/pull/4474)) into
        `python/tests/mlx_tests.py`, also listed in the v0.32.2 section.

        Upstream `f4232c7f`
        ([ml-explore/mlx#4607](https://github.com/ml-explore/mlx/pull/4607), a second cable
        for the JACCL mesh) is not ported: it is a feature that restructures the mesh into one
        `MeshImpl` per wire and moves `dispatch_wires`, so the progress guard above has to be
        reworked for it first. The section disappears once the fork rebases onto an upstream
        commit at or past `8803e524`.
      globs:
        - "mlx/distributed/distributed.cpp"
        - "python/tests/mlx_distributed_tests.py"
        - "python/tests/ring_test_distributed.py"
    - title: "Fork tooling"
      description: |
        The fork deletes the upstream workflows that cannot run here: the PyPI release build and
        the documentation deploy. `build_and_test.yml` keeps the lint, sanitizer and Fedora jobs.
        The fork deletes the jobs that run only in the upstream repository, and the composite
        actions that only the deleted workflows and jobs used.

        The gate that keeps this page honest: `check_forkdiff.py` fails CI when `base.hash` is
        not the merge-base with upstream, when a file the fork changes is not described by a
        section above, or when a section names files the fork no longer changes.

        `fork-tests.yml` builds the fork with Metal and runs its C++ and Python tests on a
        GitHub-hosted macOS runner. The `setup` action pins its actions to full commit SHAs,
        because the organization blocks actions that are not pinned. The organization also
        blocks `hendrikmuhs/ccache-action`, so `setup` installs ccache with Homebrew and keeps
        the ccache files with `actions/cache`. It then runs the same tests a second time with
        the CPU as the default device. Two Python tests check behavior that exists only in the
        Metal backend (Winograd batch tiling and the FFT size limit), so they skip when the
        default device is not the GPU.
      globs:
        - ".github/actions/build/action.yml"
        - ".github/actions/build-docs/action.yml"
        - ".github/actions/build-wheel/action.yml"
        - ".github/actions/test-linux/action.yml"
        - ".github/actions/test-wheel/action.yml"
        - ".github/actions/test-windows/action.yml"
        - ".github/workflows/build_and_test.yml"
        - ".github/workflows/documentation.yml"
        - ".github/workflows/release.yml"
        - "scripts/check_forkdiff.py"
        - "FORKDIFF.md"
        - "README.md"
        - ".github/actions/setup/action.yml"
        - ".github/workflows/fork-tests.yml"
        - "python/tests/test_conv.py"
        - "python/tests/test_fft.py"

# ignored globally, does not count towards line count
ignore:
  - "fork.yaml"
  - ".github/workflows/forkdiff-check.yml"
  - ".github/workflows/forkdiff-pages.yml"
